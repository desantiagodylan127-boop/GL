plugins {
    id 'com.android.application'
}

android {
    namespace 'com.titans.herocollector'
    compileSdk 35

    defaultConfig {
        applicationId 'com.titans.herocollector'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
